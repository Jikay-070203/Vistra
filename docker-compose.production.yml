services:
  backend:
    build:
      context: ./backend
      dockerfile: src/deploy/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PORT: ${PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      API_TOKEN: ${API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ACCESS_MINUTES: ${AUTH_ACCESS_MINUTES:-30}
      AUTH_REFRESH_DAYS: ${AUTH_REFRESH_DAYS:-1}
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    # Production currently runs backend only; cap it to leave host overhead.
    mem_limit: 384m
    mem_reservation: 192m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT','8000') + '/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Frontend production is deployed separately on Vercel.
