text_embedding_model: voyageai/voyage-4-nano
image_embedding_model: google/siglip2-base-patch16-224
cache_folder: .cache
embedding_device: auto
models_local_files_only: true
text_vector_size: 2048
image_vector_size: 768
image_normalize: true

qdrant_path: databases/vector_db/qdrant
qdrant_images_path: databases/vector_db/qdrant_images
qdrant_url: http://127.0.0.1:6333
qdrant_timeout_seconds: 30.0
qdrant_local_max_storage_mb: 512
query_embedding_cache_size: 32
sqlite_path: databases/sqlite_db/scraped_data.sqlite3
wikivoyage_collection: wikivoyage_voyage
scraped_images_collection: scraped_images

wikivoyage_pages_dump: datasets/raw/wikivoyage/enwikivoyage-latest-page.sql
wikivoyage_geo_dump: datasets/raw/wikivoyage/enwikivoyage-latest-geo_tags.sql
wikivoyage_articles_dump: datasets/raw/wikivoyage/enwikivoyage-latest-pages-articles.xml
wikivoyage_pages_path: datasets/processed/wikivoyage/pages.jsonl
wikivoyage_geo_tags_path: datasets/processed/wikivoyage/geo_tags.jsonl
wikivoyage_articles_path: datasets/processed/wikivoyage/articles.jsonl
wikivoyage_chunks_path: datasets/processed/wikivoyage/chunks.jsonl
removed_chunk_ids_path: datasets/processed/wikivoyage/removed_chunk_ids.json
token_audit_directory: datasets/processed/wikivoyage/token_audit
coordinate_cleanup_directory: datasets/processed/wikivoyage/coordinate_cleanup
scraped_places_path: datasets/raw/scraped_data/places.compact.jsonl
scraped_photos_directory: datasets/raw/scraped_data/photos
image_manifest_path: datasets/processed/scraped/image_manifest.jsonl
destination_mappings_path: null
location_mappings_path: datasets/processed/location_mappings.json
country_scopes_path: src/resolver/country_scopes.json
location_aliases:
  Hanoi: ["Hanoi, Vietnam"]
  Phu Quoc: ["Phu Quoc, Vietnam"]
image_search_score_threshold: null

chunk_size: 450
chunk_overlap: 60
chunk_min_tokens: 40
text_embedding_batch_size: 32
wikivoyage_index_batch_size: 32
image_index_batch_size: 32
metadata_index_batch_size: 500

search_limit: 5
retrieval_limit: 10
retrieval_group_size: 3
candidate_min_limit: 20
candidate_multiplier: 4
destination_max_distance_km: 30.0
rrf_k: 60
text_weight: 1.0
image_weight: 1.0

jev_api_url: https://api.typesafe.ai/v1/systemone
jev_model: jev-latest
jev_timeout_seconds: 15.0

openai_model: gpt-5-nano
openai_reasoning_effort: low
generation_timeout_seconds: 45.0
generation_max_tokens: 4000
generation_context_results: 5
generation_context_hits: 3
generation_excerpt_chars: 1800
generation_history_messages: 12
generation_history_chars: 2000
generation_image_max_edge: 1280

chat_memory_path: databases/vector_db/chat_memory
chat_memory_collection: chat_memory
chat_memory_vector: text
chat_max_conversations: 32
chat_summary_chars: 1500
chat_memory_limit: 20
chat_memory_fact_chars: 500
  
app_max_upload_mb: 8
app_image_max_edge: 1280
app_max_conversations: 32
app_user_id: local
app_uploads_path: app/uploads
app_message_max_chars: 4000
app_map_tile_url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
app_map_attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
app_map_center: [16.0, 106.0]
app_map_zoom: 5

sparse_embedding_model: Qdrant/bm25
sparse_embedding_batch_size: 256
wikivoyage_sparse_index_batch_size: 256
sparse_models_local_files_only: false

bm25_k: 1.2
bm25_b: 0.75
bm25_avg_len: 256.0
bm25_language: english

wikivoyage_sparse_vector: bm25

travel_timeout_seconds: 8.0
travel_candidate_limit: 3
travel_poi_limit: 5
travel_poi_candidate_limit: 40
travel_poi_radius_km: 5.0
travel_overpass_enabled: false
travel_overpass_url: https://overpass-api.de/api/interpreter
travel_wikidata_enabled: true
travel_ors_base_url: https://api.heigit.org/openrouteservice/v2
travel_cost_catalog_path: null
travel_timetable_path: null
travel_weather_sample_years: 3
travel_weather_heat_c: 34.0
travel_weather_rain_mm: 10.0
travel_weather_wind_kmh: 40.0

planning:
  enabled: true
  max_days: 7
  max_stops_per_day: 3
  max_route_calls_per_turn: 6
  max_revisions: 2
  day_start_minutes: 540
  day_end_minutes: 1080
  activity_minutes: 90
  travel_buffer_minutes: 15
  unknown_leg_reserve_minutes: 60
  visit_catalog_path: null
  hours_max_age_days: 30

travel_dna_path: databases/sqlite_db/travel_dna.sqlite

# Disabling model review returns a fixed evidence summary, never unchecked prose.
guardrails:
  model_review_enabled: true
  max_repairs: 1
  review_timeout_seconds: 20.0
  review_max_tokens: 4000
  max_answer_chars: 14000
  max_blocks: 40
  max_evidence_chars: 48000
  max_record_chars: 7000
  max_message_chars: 4000
  max_search_limit: 20
  max_network_calls: 32
  max_model_calls: 6
  allowed_tool_hosts:
    - api.open-meteo.com
    - archive-api.open-meteo.com
    - geocoding-api.open-meteo.com
    - api.frankfurter.dev
    - www.wikidata.org
    - overpass-api.de
    - api.heigit.org
