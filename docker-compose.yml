services:
  backend:
    build:
      context: ./backend
      dockerfile: src/deploy/Dockerfile
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_PATH: /app/data/yourtripyourtry.db
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-demo
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: p103-app-network
