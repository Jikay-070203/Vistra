services:
  postgres:
    image: postgres:17-alpine
    # Keep the complete local stack below an 800 MB Docker limit.
    mem_limit: 192m
    mem_reservation: 96m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=15
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
    environment:
      POSTGRES_DB: yourtripyourtry_local
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-postgres-password
    ports:
      - "5434:5432"
    volumes:
      - vistra_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d yourtripyourtry_local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: src/deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://app:local-postgres-password@postgres:5432/yourtripyourtry_local
      DATABASE_PATH: /app/data/yourtripyourtry.db
      PORT: 8000
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      API_TOKEN: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: ""
      AUTH_COOKIE_SECURE: "false"
      AUTH_ACCESS_MINUTES: "30"
      AUTH_REFRESH_DAYS: "1"
    ports:
      - "8000:8000"
    mem_limit: 320m
    mem_reservation: 160m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    mem_limit: 128m
    mem_reservation: 64m
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vistra_postgres_local:
