<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vistra Auth Token Test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 9px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    pre { background: #111827; color: #d1fae5; padding: 16px; white-space: pre-wrap; border-radius: 8px; }
    .note { color: #555; }
  </style>
</head>
<body>
  <h1>Vistra Auth Test</h1>
  <p class="note">Cookie <b>HttpOnly</b> không đọc được bằng JavaScript. Trình duyệt sẽ tự lưu và gửi token.</p>

  <label>Backend URL</label>
  <input id="base" value="https://vistra-backend-production.up.railway.app">
  <label>Email</label>
  <input id="email" value="admin@vistral.com">
  <label>Password</label>
  <input id="password" type="password" value="">

  <div>
    <button onclick="login()">Login</button>
    <button onclick="me()">Check session</button>
    <button onclick="refresh()">Refresh token</button>
    <button onclick="logout()">Logout</button>
    <button onclick="aiStatus()">AI provider status</button>
  </div>
  <hr>
  <h2>AI provider (admin)</h2>
  <p class="note">API key chỉ gửi khi bấm Save, không hiển thị lại trong response.</p>
  <label>Provider</label>
  <select id="provider" style="padding:9px;width:100%">
    <option value="gemini">Gemini</option>
    <option value="openai">OpenAI</option>
  </select>
  <label>Model (để trống dùng mặc định)</label>
  <input id="model" placeholder="gemini-3.5-flash-lite hoặc gpt-4o-mini">
  <label>API key</label>
  <input id="providerKey" type="password" autocomplete="off" placeholder="Nhập key provider">
  <button onclick="saveAI()">Save AI provider</button>
  <pre id="output">Chưa thực hiện request.</pre>

  <script>
    const out = document.getElementById('output');
    const base = () => document.getElementById('base').value.replace(/\/$/, '');
    const show = (label, status, data) => {
      out.textContent = `${label}\nHTTP ${status}\n\n${JSON.stringify(data, null, 2)}`;
    };
    async function call(label, path, options = {}) {
      try {
        const response = await fetch(base() + path, {
          ...options,
          credentials: 'include',
          headers: {'Content-Type': 'application/json', ...(options.headers || {})}
        });
        const text = await response.text();
        let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        show(label, response.status, data);
      } catch (error) { show(label, 'NETWORK ERROR', String(error)); }
    }
    function login() {
      call('LOGIN', '/api/v1/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
    }
    function me() { call('CURRENT SESSION', '/api/v1/auth/me'); }
    function refresh() { call('REFRESH TOKEN', '/api/v1/auth/refresh', {method: 'POST'}); }
    function logout() { call('LOGOUT', '/api/v1/auth/logout', {method: 'POST'}); }
    function aiStatus() { call('AI PROVIDER STATUS', '/api/v1/admin/ai/provider'); }
    function saveAI() {
      call('UPDATE AI PROVIDER', '/api/v1/admin/ai/provider', {
        method: 'PUT',
        body: JSON.stringify({
          provider: document.getElementById('provider').value,
          model: document.getElementById('model').value,
          apiKey: document.getElementById('providerKey').value
        })
      });
    }
  </script>
</body>
</html>
