services:
  postgres-staging:
    image: postgres:17-alpine
    container_name: p103-postgres-staging
    environment:
      POSTGRES_DB: yourtripyourtry_staging
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-staging-password
    ports:
      - "5434:5432"
    volumes:
      - p103_postgres_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d yourtripyourtry_staging"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  p103_postgres_staging:

networks:
  default:
    name: p103-postgres-staging-network
